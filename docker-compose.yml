services:
  db:
    image: postgres:18
    container_name: film-finder-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: movies
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql 
      - ./db2.sql:/docker-entrypoint-initdb.d/db2.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movies"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./film-finder-backend
    container_name: film-finder-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:root@db:5432/movies
    volumes:
      - ./film-finder-backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./film-finder-frontend
    container_name: film-finder-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:


